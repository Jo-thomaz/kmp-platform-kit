name: iosApp
options:
  bundleIdPrefix: ${BUNDLE_ID}
  deploymentTarget:
    iOS: ${IOS_DEPLOYMENT_TARGET}
packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.19.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    FRAMEWORK_SEARCH_PATHS:
      - "$(inherited)"
      - "$(SRCROOT)/../shared/umbrella/build/bin/iosSimulatorArm64/debugFramework"
    OTHER_LDFLAGS:
      - "$(inherited)"
      - "-framework"
      - "SharedUmbrella"
      - "-lsqlite3"
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: ${IOS_DEPLOYMENT_TARGET}
    sources:
      - path: App
      - path: DesignSystem
      - path: Features
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.ios
        INFOPLIST_KEY_CFBundleDisplayName: ${APP_NAME}
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: ${IOS_DEPLOYMENT_TARGET}
    sources:
      - path: Tests
    dependencies:
      - target: iosApp
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iosApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/iosApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
        iosAppTests: [test]
    test:
      targets:
        - iosAppTests
